<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sellers | Homey</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo.png">
    <link href="css/fonts.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/extras.css" rel="stylesheet">
</head>

<body>
    <!-- The navbar is drawn here by js/nav.js -->
    <div id="site-nav"></div>

    <main>
        <div class="container-fluid py-5">
            <div class="container py-5">
                <div class="row">
                    <div class="col-lg-6">
                        <h1 class="section-title position-relative mb-md-5 mb-0">Homemade food near you</h1>
                    </div>
                    <div class="col-lg-6 mb-5 mb-lg-0 pb-5 pb-lg-0"></div>
                </div>
                <p id="greeting" class="mb-4" hidden></p>
                <div class="search-bar mb-3">
                    <select id="cityFilter" aria-label="Choose your city">
                        <option value="">All cities</option>
                    </select>
                </div>
                <p id="resultCount" class="text-center text-muted mb-5" aria-live="polite"></p>
                <div class="col-12">
                    <div class="row" id="sellerGrid"></div>
                    <div class="empty-state" id="emptyState" hidden>
                        <h3>No sellers in this city yet</h3>
                        <p class="text-muted">Choose another city to see sellers near you.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- The footer is drawn here by js/nav.js -->
    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/browse.js"></script>
</body>

</html>
