<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Register | Homey</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo.png">
    <link href="css/fonts.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/extras.css" rel="stylesheet">
</head>

<body>
    <!-- The navbar is drawn here by js/nav.js -->
    <div id="site-nav"></div>

    <main>
        <div class="container my-5 py-5">
            <div class="row justify-content-center">
            <div class="col-md-6 col-10 bg-light" style="width: 18rem; min-height: 500px;">
             <h1 class="py-3 mt-5 text-center">Register</h1>

                <form class="px-4" id="signupForm" novalidate>
                    <div class="form-message" id="signupError" role="alert" hidden></div>
                    <div class="mb-3">
                        <label for="sName" class="form-label font-weight-bold text-left">Name</label>
                        <input type="text" class="form-control py-2" id="sName" autocomplete="name">
                        <div class="field-error" id="sNameError" aria-live="polite"></div>
                        <div class="form-text">Sellers: use your shop name.</div>
                    </div>
                    <div class="mb-3">
                        <label for="sEmail" class="form-label font-weight-bold text-left">Email address</label>
                        <input type="email" class="form-control py-2" id="sEmail" autocomplete="email">
                        <div class="field-error" id="sEmailError" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="sPassword" class="form-label font-weight-bold">Password</label>
                        <input type="password" class="form-control" id="sPassword" autocomplete="new-password">
                        <div class="field-error" id="sPasswordError" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <span class="font-weight-bold">I am a</span>
                        <div class="radio-row">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleCustomer" value="customer" checked>
                                <label class="form-check-label" for="roleCustomer">Customer</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleSeller" value="seller">
                                <label class="form-check-label" for="roleSeller">Seller</label>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary col-8 py-2 font-weight-bold text-center" id="signupBtn">Register</button>
                    </div>
                    <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
                </form>
            </div>
            </div>
        </div>
    </main>

    <!-- The footer is drawn here by js/nav.js -->
    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/signup.js"></script>
</body>

</html>
