<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Order | Homey</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/logo.png">
    <link href="css/fonts.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/extras.css" rel="stylesheet">
</head>

<body>
    <!-- The navbar is drawn here by js/nav.js -->
    <div id="site-nav"></div>

    <main>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8 col-11 bg-light rounded p-4">
                    <h1 class="py-3 text-center">Your order</h1>
                    <div id="orderForm">
                        <div id="orderItem" class="order-item"></div>
                        <div class="text-center">
                            <button type="button" class="btn btn-primary col-8 py-2 font-weight-bold" id="confirmBtn">Confirm order</button>
                            <p class="mt-3 mb-0"><a href="browse.html" id="orderBack">Back to the menu</a></p>
                        </div>
                    </div>
                    <div id="orderDone" hidden>
                        <div class="success-box" role="status">
                            <h2>Order placed</h2>
                            <p class="mb-0" id="orderDoneText"></p>
                        </div>
                        <p class="mb-0"><a href="browse.html">Back to sellers</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- The footer is drawn here by js/nav.js -->
    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/order.js"></script>
</body>

</html>
